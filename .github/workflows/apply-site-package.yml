name: Apply verified site package

on:
  push:
    branches:
      - main
    paths:
      - site-package.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name site-package.zip -exec rm -rf {} +
          unzip -o site-package.zip
          rm -f site-package.zip
          rm -f .github/workflows/apply-site-package.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit verified site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy verified SVETLAB site"
          git push
